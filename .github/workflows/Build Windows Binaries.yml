name: Build Windows Binaries

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest]
        
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set Strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Get Latest Version
        id: tag_version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_BUILD_TYPE=Release
          -S ${{ github.workspace }}

      - name: Build CMake
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

      - name: Upload Raw Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapeWorm-${{ matrix.os }}
          path: |
            build/Release/TapeWorm-${{ steps.tag_version.outputs.tag }}-Windows.exe
 
      - name: Build Windows Installer MSI
        uses: AliceOh/CreateWindowsInstaller@1.0.0
        with:
          exefile: build/Release/TapeWorm-${{ steps.tag_version.outputs.tag }}-Windows.exe
          version: ${{ steps.tag_version.outputs.tag }}

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-installer
          path: |
            *.msi
