name: Build Documentation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build
        run: |
          doxygen Docs/Doxyfil

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Docs/html' 

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
    
